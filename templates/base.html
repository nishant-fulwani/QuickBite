<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickBite - Fast Delivery</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-danger">
        <div class="container">
            <a class="navbar-brand fw-bold" href="{{ url_for('home') }}">🍔 QuickBite</a>
            <div class="d-flex">
                <a href="{{ url_for('admin_dashboard') }}" class="btn btn-outline-light me-3">Admin</a>
                <a href="{{ url_for('view_cart') }}" class="btn btn-warning text-dark fw-bold">Cart ({{ cart_count }})</a>
            </div>
        </div>
    </nav>

    <!-- Main Content Area -->
    <div class="container mt-4">
        {% block content %}{% endblock %}
    </div>

</body>
</html>
